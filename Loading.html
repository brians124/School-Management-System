<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celebrating a Milestone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0a0a0a;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }

        /* Glassmorphism Card */
        .celebration-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #ffcc00, #ff6699);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #cccccc;
            margin-bottom: 20px;
        }

        .apology {
            font-style: italic;
            font-size: 0.9rem;
            color: #888;
        }

        /* Loading Spinner */
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #ffcc00;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #timer {
            font-weight: bold;
            color: #ffcc00;
        }
    </style>
</head>
<body>

    <div class="celebration-card">
        <h1>Happy Birthday to our Founder!</h1>
        <p>Please wait a moment. The owner of this system is currently celebrating his birthday!</p>
        
        <p class="apology">We sincerely apologize for the brief delay in your access. Thank you for your patience and for being part of our journey.</p>
        
        <div class="loader"></div>
        
        <p style="font-size: 0.8rem;">Redirecting to the system in <span id="timer">5</span> seconds...</p>
    </div>

    <script>
        // Set the countdown time
        let timeLeft = 5;
        const timerElement = document.getElementById('timer');

        const countdown = setInterval(() => {
            timeLeft--;
            timerElement.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                window.location.href = "index.html"; // Redirect to your main page
            }
        }, 1000);
    </script>
</body>
</html>
